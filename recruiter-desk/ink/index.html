<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recruiter Desk · Crovanta Partners</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Recruiter Desk by Crovanta Partners: AI recruitment operations for IT services teams. Requisitions, internal-resource checks, approvals, screening, interviews and offers in one workflow.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* Pencil & Ink: paper background, ink-navy borders, orange for urgency. Dashed = Desk drafted (pencil), solid = confirmed by a person (ink). */
:root{
  --paper:#EEF1F8; --card:#FFFFFF; --pencil:#F6F8FC; --ink:#1E2A78; --text:#151B3D; --muted:#596084; --hair:#CBD1E7;
  --tint:#DCE1F3; --tint2:#AAB6EA; --fill:#1E2A78; --on-fill:#FFFFFF; --orange:#FF8A4C; --on-orange:#151B3D; --grey:#6B6F80;
  --pdash:#7F87B4; --warn:#A94B17; --bad:#B8441A; --warn-soft:#FFE6D8; --bad-soft:#FFDCCB;
  --f:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:var(--paper); --surface:var(--card); --sunk:var(--pencil); --line:var(--hair); --fg:var(--text); --navy:var(--fill);
  --gold:var(--ink); --gold-soft:var(--tint); --gold-ink:var(--ink); --btn:var(--fill); --btn-fg:var(--on-fill);
  --good:var(--ink); --good-soft:var(--tint); --info:var(--ink); --info-soft:var(--tint); --shadow:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1030; --card:#141940; --pencil:#11153A; --ink:#AEBBFF; --text:#E9ECFA; --muted:#9EA5CB; --hair:#2C336A;
  --tint:#232A5E; --tint2:#3C4896; --fill:#C9D2FF; --on-fill:#10153A; --orange:#FF9A62; --on-orange:#151B3D; --grey:#8E93AE;
  --pdash:#6E78B8; --warn:#FFB088; --bad:#FF9A62; --warn-soft:#3A2416; --bad-soft:#40230F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1030; --card:#141940; --pencil:#11153A; --ink:#AEBBFF; --text:#E9ECFA; --muted:#9EA5CB; --hair:#2C336A;
  --tint:#232A5E; --tint2:#3C4896; --fill:#C9D2FF; --on-fill:#10153A; --orange:#FF9A62; --on-orange:#151B3D; --grey:#8E93AE;
  --pdash:#6E78B8; --warn:#FFB088; --bad:#FF9A62; --warn-soft:#3A2416; --bad-soft:#40230F; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.disp,h1{font-family:var(--f);font-stretch:62%;font-weight:850;text-transform:uppercase;letter-spacing:-.005em;line-height:.92}
h1{font-size:clamp(36px,5.2vw,64px)}
h2{font-family:var(--f);font-stretch:70%;font-weight:800;text-transform:uppercase;font-size:21px;letter-spacing:.005em}
h3{font-size:15px;font-weight:750}
.mono,.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}

/* shell */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:20px;padding:12px 40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));min-height:76px}
.wm{font-family:var(--f);font-stretch:62%;font-weight:900;font-size:28px;letter-spacing:-.01em;color:var(--text);text-decoration:none;white-space:nowrap;line-height:1}
.org{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.cmd{flex:1;min-width:200px;max-width:760px;display:flex;align-items:center;gap:10px;background:var(--fill);color:var(--on-fill);padding:0 12px 0 16px;height:48px}
.cmd span{color:var(--orange);font-family:var(--mono);font-weight:700}
.cmd input{flex:1;background:transparent;border:0;color:var(--on-fill);font-family:var(--mono);font-size:13.5px;padding:0;min-width:0;height:100%}
.cmd input::placeholder{color:color-mix(in srgb,var(--on-fill) 62%,transparent)}
.cmd input:focus{outline:none}.cmd:focus-within{outline:2px solid var(--orange);outline-offset:2px}
.cmd kbd{font-family:var(--mono);font-size:12px;border:1.5px solid color-mix(in srgb,var(--on-fill) 55%,transparent);padding:1px 7px;color:var(--on-fill)}
.pnav{display:flex;gap:4px;align-items:stretch;margin-left:auto}
.pnav a,.pnav button{font:inherit;font-size:16px;font-weight:500;color:var(--text);text-decoration:none;padding:10px 12px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;border-radius:0}
.pnav a[aria-current="page"],.pnav button[aria-current="page"]{font-weight:750;color:var(--ink);border-bottom-color:var(--ink)}
.pnav a:hover,.pnav button:hover{color:var(--ink)}
.cnt{font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid var(--ink);color:var(--ink);padding:0 5px;line-height:1.5}
.cnt.hot{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.mebtn{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;flex:none;padding:0}
main{padding:36px 40px 110px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.inner{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
body.signedout .topbar,body.signedout .tabbar{display:none!important}
body.signedout main{padding:0}
body.signedout .inner{max-width:none}

/* headings */
.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1.5px solid var(--hair)}
.heading .t{min-width:240px;flex:1}
.heading h1{margin:10px 0 8px}
.heading p{margin:0;color:var(--muted);max-width:720px}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.backrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-12px 0 4px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.backrow a,.backrow button.back{font-weight:700;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;font-size:16px;cursor:pointer}

/* controls */
button,.btn{font:inherit;font-size:15px;font-weight:650;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:0;padding:10px 16px;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:var(--tint)}
button.dark,button.good,.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--on-fill);font-weight:750}
button.dark:hover,button.good:hover{filter:brightness(1.15)}
button.goldb{background:var(--pencil);border:1.5px dashed var(--pdash);color:var(--ink)}
button.warnb{background:var(--card)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:6px 11px;font-size:13.5px}
button.link{border:0;background:none;color:var(--ink);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
button.link:hover{background:none}
button:disabled{opacity:.42;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--card);border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:10px 4px;width:100%;min-width:0}
select,textarea{border:1.5px solid var(--ink);padding:9px 10px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--fill)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text);font-weight:650;min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.spacer{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub{font-size:13.5px;color:var(--muted)}

/* surfaces */
.panel{background:var(--card);border:1.5px solid var(--ink);padding:20px 22px;min-width:0;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph .sub{font-size:13px}
.pencil{background:var(--pencil);border:1.5px dashed var(--pdash);padding:14px 18px}
.inked{background:var(--card);border:2px solid var(--ink);padding:14px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:2px solid var(--ink);background:var(--card)}
.stat{padding:18px 20px;border-right:1.5px solid var(--hair);min-width:0}
.stat:last-child{border-right:0}
.stat .h{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px}
.stat .ic{display:none}
.stat .n{font-family:var(--mono);font-size:30px;font-weight:700;margin:8px 0 2px;font-variant-numeric:tabular-nums;color:var(--text)}
.stat .n small{font-size:15px;color:var(--muted);font-weight:500}
.stat .s{font-size:13px;color:var(--muted)} .stat .s.bad{color:var(--bad);font-weight:650}
.stat.hot{background:var(--orange);color:var(--on-orange)} .stat.hot .h,.stat.hot .n,.stat.hot .n small,.stat.hot .s{color:var(--on-orange)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:36px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.colstack{display:flex;flex-direction:column;gap:22px;min-width:0}
.notice{border:1.5px dashed var(--pdash);background:var(--pencil);padding:12px 16px;font-size:14px;color:var(--text)}
.notice.warn,.notice.bad{border:2px solid var(--orange);background:var(--warn-soft)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1.5px dashed var(--pdash);background:var(--pencil)}
.empty h3{color:var(--text);margin-bottom:8px;font-size:18px}

/* tags */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;white-space:nowrap;border-radius:0}
.pill.good{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.pill.gold,.pill.warn,.pill.acc{border-style:dashed;border-color:var(--pdash)}
.pill.bad,.pill.hot{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.pill.plain{border-color:var(--hair);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;min-width:18px;padding:0 5px;background:var(--orange);color:var(--on-orange);font-family:var(--mono);font-size:11px;font-weight:700;text-align:center}
.tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:17px;padding:4px 9px;border:2px solid var(--ink);color:var(--text);white-space:nowrap;line-height:1.1}
.tag.hot{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}

/* lists, tables */
.att{display:flex;flex-direction:column;gap:0}
.attrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1.5px solid var(--hair);background:none;cursor:pointer;text-align:left;width:100%;font-weight:400;color:var(--text);text-decoration:none}
.attrow:hover{background:var(--tint)}
.dot{width:10px;height:10px;background:var(--ink);flex:none} .dot.bad{background:var(--orange)}
.attrow .grow{flex:1;min-width:0} .attrow b{display:block;font-size:15px} .attrow small{color:var(--muted);font-size:13px}
.attrow .when{color:var(--bad);font-family:var(--mono);font-size:12px;white-space:nowrap;font-weight:700}
.insight{background:var(--pencil);border:1.5px dashed var(--pdash)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:10px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:12px 10px;border-bottom:1.5px solid var(--hair);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--tint)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.person{display:flex;align-items:center;gap:10px}
.mini{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11.5px;color:var(--ink);font-weight:800;flex:none;background:var(--card)}
.person small{display:block;color:var(--muted);font-size:12.5px}
.person b{font-weight:700}
.tabs{display:flex;gap:0;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--ink);margin-right:-1.5px;background:var(--card);color:var(--ink);padding:7px 13px;font-size:14px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--pencil);border:1.5px solid var(--hair);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.col h3{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.col h3 span{color:var(--muted);font-weight:500}
.card{background:var(--card);border:1.5px solid var(--ink);padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font-weight:400;width:100%;color:var(--text);border-radius:0}
.card:hover{background:var(--tint)}
.ptabs{display:flex;gap:0;border-bottom:2px solid var(--ink);overflow-x:auto}
.ptabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;margin-bottom:-2px}
.ptabs button:hover{background:none;color:var(--ink)}
.ptabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--orange);font-weight:750}
.score{font-family:var(--mono);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1.5px solid var(--hair)} .skill:first-child{border-top:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;color:var(--text);font-weight:400}
.check input{width:18px;margin-top:2px}
.round{border:1.5px solid var(--hair);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.round.cur{border:2px solid var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.facts .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts .v{font-weight:700;margin-top:3px}
pre.msg{white-space:pre-wrap;font-family:var(--f);background:var(--pencil);border:1.5px dashed var(--pdash);padding:14px;margin:0;font-size:14.5px}
.portal{border:2px solid var(--ink);background:var(--card);padding:20px;max-width:420px;display:flex;flex-direction:column;gap:12px}
.cardlet{border:1.5px solid var(--hair);padding:11px 13px;background:var(--pencil)} .cardlet b{display:block}
.journey div{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;color:var(--muted)}
.journey i{width:12px;height:12px;border:2px solid var(--hair);flex:none}
.journey .d i{background:var(--fill);border-color:var(--fill)} .journey .d{color:var(--text)}
.journey .c i{border-color:var(--orange);background:var(--orange)} .journey .c{color:var(--text);font-weight:700}
.journey .x i{background:var(--bad);border-color:var(--bad)} .journey .x{color:var(--bad);font-weight:700}
.hist div{padding:8px 0;border-top:1.5px solid var(--hair);font-size:14px} .hist div:first-child{border-top:0}
.bars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.hbar .t{height:14px;background:var(--tint);overflow:hidden} .hbar .t span{display:block;height:100%;background:var(--fill)}
.hbar .v{font-family:var(--mono);font-weight:700;white-space:nowrap}
.pipeline{display:flex;gap:12px;align-items:end;height:180px;padding-top:6px}
.pipe{flex:1;text-align:center;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0;color:var(--text)}
.pipe:hover{background:none}
.pipe .barv{margin:0 auto;width:min(52px,72%);background:var(--fill);min-height:4px}
.pipe b{font-family:var(--mono);font-size:15px;margin-bottom:6px;display:block}
.pipe span{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.integ{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

/* Ask Desk */
.aimark{width:34px;height:34px;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;font-weight:900;font-family:var(--mono);flex:none}
.ai-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.chat{background:var(--card);border:2px solid var(--ink);display:flex;flex-direction:column}
.chathead{padding:14px 18px;border-bottom:1.5px solid var(--hair);display:flex;align-items:center;gap:12px}
.chathead small{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
.chatbody{padding:22px;min-height:420px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.welcome h2{font-size:30px;margin:6px 0 10px}
.welcome p{color:var(--muted);max-width:640px;margin:0}
.suggest{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:20px}
.suggest button{text-align:left;font-weight:400;padding:14px;display:block;background:var(--pencil);border:1.5px dashed var(--pdash);color:var(--text)}
.suggest button b{display:block;font-size:15px;margin-bottom:3px;color:var(--ink)}
.suggest button small{color:var(--muted);font-size:13px}
.suggest button:hover{border-style:solid;border-color:var(--ink);background:var(--card)}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:12px 15px;background:var(--pencil);min-width:0;overflow-wrap:anywhere;border:1.5px solid var(--hair)}
.msg.user .bubble{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.bubble p{margin:0 0 8px} .bubble p:last-child{margin:0} .bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}
.acard{border:1.5px dashed var(--pdash);padding:12px 14px;margin-top:10px;background:var(--pencil)}
.acard.done{border:2px solid var(--ink);background:var(--card)}
.acard h4{margin:0 0 4px;font-size:14.5px} .acard h4::before{content:"DESK DRAFTED · ";font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:500}
.acard p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.composer{border-top:1.5px solid var(--hair);padding:14px;display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px}
.chatfoot{font-size:12.5px;color:var(--muted);padding:0 16px 14px}
.ctx .row{display:flex;flex-direction:column;padding:10px 0;border-top:1.5px solid var(--hair)} .ctx .row:first-child{border-top:0}

function md(s){
  const lines=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let out="",list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){const m=l.match(/^\s*(?:[-•*]|(\d+)\.)\s+(.*)$/);
    if(m){const k=m[1]?"ol":"ul";if(list!==k){close();out+=`<${k}>`;list=k}out+=`<li>${m[2]}</li>`}
    else{close();if(l.trim())out+=`<p>${l}</p>`}}
  close();return out;
}

/* ----- analytics ----- */
function vAnalytics(){
  const cs=Object.values(S.cands).filter(visibleCand);
  const top=head("HIRING INTELLIGENCE","Analytics","Understand pipeline health, delays and recruitment outcomes.",cs.length?askBtn("Generate AI report","Write an operational hiring report: pipeline health, SLA compliance against targets (first touch 95%, feedback 90%, stale under 2%), source effectiveness, bottlenecks and three recommendations."):"");
  if(!cs.length)return top+`<div class="empty"><h3>No data yet</h3>Analytics fill in as candidates move through the pipeline.</div>`;
  const hired=c=>!!(c.acceptedAt||c.stage==="Joined");
  const released=cs.filter(c=>c.offerReleasedAt),joined=cs.filter(c=>c.stage==="Joined");
  const reach=c=>c.stage===OUT?(c.rejectedAtIdx??0):Math.max(c.maxIdx??-1,STAGES.indexOf(c.stage));
  const funnel=STAGES.map((s,i)=>[stageName(s),cs.filter(c=>reach(c)>=i).length]);
  const src={};cs.forEach(c=>{const k=c.source||"Other";src[k]=src[k]||{n:0,h:0};src[k].n++;if(hired(c))src[k].h++});
  const mx=Math.max(1,...Object.values(src).map(v=>v.n));const sl=slaStats(cs);
  const tth=cs.filter(c=>c.acceptedAt).map(c=>(new Date(c.acceptedAt)-new Date(c.createdAt))/864e5);
  const rej={};cs.filter(c=>c.stage===OUT&&c.rejection).forEach(c=>{rej[c.rejection.reason]=(rej[c.rejection.reason]||0)+1});
  const ins=insight();
  const slaBar=(l,v,ok,tgt)=>`<div class="hbar" style="grid-template-columns:130px minmax(0,1fr) 54px"><span>${l}<div class="sub">${tgt}</div></span><span class="t"><span style="width:${v||0}%;background:${v==null?"var(--sunk)":ok?"var(--good)":"var(--warn)"}"></span></span><span class="v">${v==null?"–":v+"%"}</span></div>`;
  return top+`<div class="stats">${stat("First touch within 24h","◷",sl.touch==null?"–":sl.touch+"%","Target 95%",sl.touch!=null&&sl.touch<95?"bad":"good")}${stat("Feedback within 24h","✓",sl.fb==null?"–":sl.fb+"%","Target 90%",sl.fb!=null&&sl.fb<90?"bad":"good")}${stat("Offer-to-join","→",released.length?Math.round(joined.length/released.length*100)+"%":"–",joined.length+" of "+released.length+" released offers")}${stat("Avg. time to hire","◫",tth.length?Math.round(tth.reduce((a,b)=>a+b,0)/tth.length)+" days":"–","Application to acceptance")}</div>
  ${ins?`<div class="panel insight"><div class="actions"><div class="aimark">D</div><div class="eyebrow">AI insight</div></div><div>${esc(ins.text)}</div><button class="link" style="align-self:flex-start" onclick='askAI("Create an action plan for the biggest bottleneck in my pipeline, with owners and the reminders I should send today.")'>Create action plan with AI →</button></div>`:""}
  <div class="cols"><div class="panel"><div class="ph"><h2>Source effectiveness</h2><span class="sub">Applications vs hires</span></div><div class="bars">${Object.entries(src).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><span class="t"><span style="width:${v.n/mx*100}%"></span></span><span class="v">${v.n} apps / ${v.h} hire${v.h===1?"":"s"}</span></div>`).join("")}</div></div>
  <div class="panel"><div class="ph"><h2>SLA compliance</h2></div><div class="bars">${slaBar("First touch",sl.touch,sl.touch>=95,"within 24h")}${slaBar("Feedback",sl.fb,sl.fb>=90,"within 24h")}${slaBar("No update",sl.stale,sl.stale!=null&&sl.stale<2,"over 7 days")}</div></div></div>
  <div class="cols"><div class="panel"><div class="ph"><h2>Hiring funnel</h2><span class="sub">Reached each stage · share that moved on</span></div><div class="bars">${funnel.map(([s,n],i)=>`<div class="hbar" style="grid-template-columns:110px minmax(0,1fr) 84px"><span>${s}</span><span class="t"><span style="width:${n/Math.max(1,funnel[0][1])*100}%"></span></span><span class="v">${n}${i?` <span class="sub">${funnel[i-1][1]?Math.round(n/funnel[i-1][1]*100):0}%</span>`:""}</span></div>`).join("")}</div></div>
  <div class="panel"><div class="ph"><h2>Rejection reasons</h2></div>${Object.keys(rej).length?`<div class="bars">${Object.entries(rej).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar" style="grid-template-columns:minmax(0,1fr) auto"><span>${esc(k)}</span><span class="v">${v}</span></div>`).join("")}</div>`:`<div class="sub">No rejections yet.</div>`}</div></div>`;
}

  const hd=split(lines[0]).map(h=>h.toLowerCase());const ix=k=>hd.indexOf(k);

function defTab(c){return c.stage===OUT?"overview":["New","Prescreen"].includes(c.stage)?(c.screen||busy.has(c.id)?"ai":"overview"):c.stage==="Interview"?"interviews":"offer"}
function nextAction(c){
  const r=curRound(c),act=(t,btn)=>`<div class="notice" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>Next:</b> ${t}</span><span class="spacer"></span>${btn||""}</div>`;
  if(c.stage===OUT)return act(c.rejection&&c.rejection.sentAt?"Closed. Feedback sent "+fmtD(c.rejection.sentAt)+".":"Send the rejection feedback to the candidate today.",c.rejection&&!c.rejection.sentAt?`<button class="small dark" onclick="ui.ptab='overview';render()">View message</button>`:"");
  if(c.onHold)return act("On hold. Resume when you're ready to continue.",`<button class="small" onclick="hold('${c.id}',false)">Resume</button>`);
  if(c.stage==="New")return act(c.resume?"Run the AI screen against the JD.":"Add the resume text, then run the AI screen.",c.resume?`<button class="small dark" onclick="runScreen('${c.id}')" ${busy.has(c.id)?"disabled":""}>Run AI screen</button>`:`<button class="small" onclick="ui.ptab='overview';render()">Add resume</button>`);
  if(c.stage==="Prescreen")return act(checklistDone(c)?"Checklist complete. Move to interviews.":"Complete the screening call and checklist ("+ckCount(c)+"/7).",checklistDone(c)?`<button class="small dark" onclick="toInterview('${c.id}')">Move to interview</button>`:`<button class="small" onclick="ui.ptab='checklist';render()">Open checklist</button>`);
  if(c.stage==="Interview"&&r){const w=rTime(r);return act(!w?`Schedule ${esc(r.name)}.`:w>Date.now()?(r.confirmed?`${esc(r.name)} on ${fmt(w)}. Candidate confirmed.`:`${esc(r.name)} on ${fmt(w)}. Confirm the candidate.`):`Submit ${esc(r.name)} feedback.`,`<button class="small dark" onclick="ui.ptab='interviews';render()">Open interviews</button>`)}
  if(c.stage==="Decision")return act("All rounds done. Decide and fill the offer details.",`<button class="small dark" onclick="ui.ptab='offer';render()">Decide</button>`);
  if(c.stage==="Offer approval")return act(`Waiting for ${esc(c.offer&&c.offer.approver)} to approve.`,`<button class="small dark" onclick="ui.ptab='offer';render()">Review approval</button>`);
  if(c.stage==="BGV & offer")return act("Start BGV and release the offer letter subject to BGV.",`<button class="small dark" onclick="ui.ptab='offer';render()">Open offer</button>`);
  if(c.stage==="Offer released")return act(c.acceptedAt?"Accepted. Mark joined on the DOJ once BGV is clear.":"Waiting for the candidate to accept.",`<button class="small" onclick="ui.ptab='offer';render()">Open offer</button>`);
  return "";
}
function pOverview(c){

  <div class="sub">Last activity: ${c.history&&c.history[0]?esc(c.history[0].text)+" · "+fmt(c.history[0].t):"–"}</div></div>
  <div class="panel"><div class="ph"><h2>Status</h2></div>${pills(blockers(c))}<div class="sub">Expected update to candidate: ${due(c)?fmtD(due(c)):"–"}</div>
  ${active(c)?`<div class="actions"><button class="small" onclick="hold('${c.id}',${!c.onHold})">${c.onHold?"Resume":"Put on hold"}</button><button class="small danger" onclick="rejectForm('${c.id}')">Reject</button></div>`:""}</div></div>

function pAI(c){

  if(!c.screen)return `<div class="panel"><h2>AI match assessment</h2><p class="sub" style="margin:0">Compares the resume with the JD and must-haves, recommends Advance, Hold or Reject with reasons, and lists questions for your screening call. It never rejects anyone on its own.</p><div><button class="dark" onclick="runScreen('${c.id}')" ${c.resume?"":"disabled"}>Run AI screen</button>${c.resume?"":` <span class="sub">Add resume text in Overview first.</span>`}</div></div>`;

  <div class="panel"><div class="ph"><h2>Recruiter review</h2><span class="sub">Human decision required</span></div><div><h3>AI rationale</h3><p style="margin:4px 0 0">${esc(s.reason)}</p></div>

  ${s.flags.length?`<div><h3>Flags to check</h3><ul style="margin:4px 0 0;padding-left:18px">${s.flags.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
  <div class="notice">Fairness guardrail: protected traits are excluded from scoring, and the AI never rejects a candidate on its own.</div>
  ${can?`<div><h3>Recruiter decision</h3><div class="actions" style="margin-top:6px"><button class="good" onclick="decideScreen('${c.id}')">Advance</button><button class="warnb" onclick="hold('${c.id}',${!c.onHold})">${c.onHold?"Resume":"Hold"}</button><button class="danger" onclick="rejectForm('${c.id}')">Reject</button></div><div class="sub" style="margin-top:6px">Advance moves to the checklist; the candidate goes to interviews once it is complete.</div></div>`:""}</div></div>`;

function pChecklist(c){

function pInterviews(c,j){
  if(!(c.rounds||[]).length)return `<div class="panel"><div class="sub">This job has no interview rounds. Add rounds to the job.</div></div>`;
  if(["New","Prescreen"].includes(c.stage))return `<div class="panel"><h2>Interviews unlock after screening</h2><div class="sub">Rounds for this job: ${c.rounds.map(r=>esc(r.name)).join(" → ")}</div></div>`;
  return c.rounds.map(r=>roundCard(c,j,r)).join("");

function roundCard(c,j,r){

  ${f.scores?`<div class="facts">${COMPS.map(([k,l])=>`<div><div class="k">${l}</div><div class="v">${esc(f.scores[k])} / 5</div></div>`).join("")}<div><div class="k">Overall</div><div class="v">${o?o.toFixed(1):"–"} / 5</div></div></div>`:o?`<div class="sub">Rating ${o} / 5</div>`:""}

  if(!cur)return `<div class="round" style="opacity:.6"><h2>${esc(r.name)}</h2><div class="sub">${c.stage==="Interview"?"Unlocks after the previous round's feedback is in.":"Not held."}</div></div>`;

  <div class="grid2"><label class="f" for="rm">Mode<select id="rm" onchange="rf('${c.id}','mode',this.value)">${["Virtual","In-person"].map(m=>`<option ${(r.mode||"Virtual")===m?"selected":""}>${m}</option>`).join("")}</select></label>
  ${vm?`<label class="f" for="rpl">Platform<select id="rpl" onchange="rf('${c.id}','platform',this.value)">${["Microsoft Teams","Zoom","Google Meet"].map(m=>`<option ${r.platform===m?"selected":""}>${m}</option>`).join("")}</select></label><label class="f" for="rlink">Meeting link<input id="rlink" value="${esc(r.link)}" placeholder="Paste the meeting link" onchange="rf('${c.id}','link',this.value)"></label>`:`<label class="f" for="raddr">Address<input id="raddr" value="${esc(r.address)}" onchange="rf('${c.id}','address',this.value)"></label><label class="f" for="rcont">Contact person on site<input id="rcont" value="${esc(r.contact)}" onchange="rf('${c.id}','contact',this.value)"></label>`}
  <label class="f" for="rd">Date<input id="rd" type="date" value="${esc(r.date)}" onchange="rf('${c.id}','date',this.value)"></label><label class="f" for="rt">Time<input id="rt" type="time" value="${esc(r.time)}" onchange="rf('${c.id}','time',this.value)"></label><label class="f" for="rp">Panel<input id="rp" value="${esc(r.panel)}" placeholder="Ravi Kumar, Neha Shah" onchange="rf('${c.id}','panel',this.value)"></label></div>
  ${w?`<div class="actions"><button class="small dark" onclick="inviteMsg('${c.id}')">Send invite</button><button class="small" onclick="reminderMsg('${c.id}')">Send reminder</button>
  <label class="check" style="padding:0"><input type="checkbox" id="rconf" ${r.confirmed?"checked":""} onchange="rf('${c.id}','confirmed',this.checked,1)"> Candidate confirmed${r.mode==="In-person"?" (confirmation call done)":""}</label>

  ${past||r.started?`<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px"><h3>Scorecard</h3>
  <div class="grid2">${COMPS.map(([k,l])=>`<label class="f" for="fs-${k}">${l}<select id="fs-${k}">${[5,4,3,2,1].map(n=>`<option value="${n}" ${n===3?"selected":""}>${n} / 5</option>`).join("")}</select></label>`).join("")}
  <label class="f" for="frec">Recommendation<select id="frec">${RECS.map(o=>`<option>${o}</option>`).join("")}</select></label></div>

function pOffer(c,j){
  if(STAGES.indexOf(c.stage)<3&&c.stage!==OUT)return `<div class="panel"><h2>Decision &amp; offer</h2><div class="sub">Opens once every interview round has feedback.</div></div>`;
  if(c.stage===OUT&&!c.offer)return `<div class="panel"><div class="sub">No offer was made.</div></div>`;
  if(c.stage==="Offer approval")return approvalCard(c);
  if(c.stage==="Decision")return `<div class="cols even"><div class="panel"><div class="ph"><h2>Interview decision pack</h2><span class="sub">Round feedback side by side</span></div>${packTable(c)}</div>
  <div class="panel"><div class="ph"><h2>AI feedback synthesis</h2><span class="sub">Summary supports; it does not decide</span></div>${c.pack?`<div class="bubble">${md(c.pack)}</div>`:`<div><button class="goldb" id="pack-${c.id}" onclick="packAi('${c.id}')">› Summarise feedback with AI</button></div>`}</div></div>
  ${c.offer&&c.offer.approval&&c.offer.approval!=="approved"?`<div class="notice warn">${esc(c.offer.approver)} ${c.offer.approval==="back"?"sent this offer back":"declined this offer"}${c.offer.comment?": "+esc(c.offer.comment):""}.</div>`:""}

  <div class="grid2"><label class="f" for="oc">Proposed CTC (₹ LPA)<input id="oc" type="number" step="0.1" value="${esc((c.offer&&c.offer.ctc)||c.ctcExpected)}"></label><label class="f" for="od">Date of joining<input id="od" type="date" value="${esc(c.offer&&c.offer.doj)}"></label>
  <label class="f" for="og">Designation<input id="og" value="${esc((c.offer&&c.offer.designation)||j.title)}"></label><label class="f" for="ol">Location<input id="ol" value="${esc((c.offer&&c.offer.location)||j.location)}"></label>
  <label class="f" for="ob">Joining bonus / notice buyout (₹)<input id="ob" value="${esc(c.offer&&c.offer.bonus)}"></label><label class="f" for="oa">Approver<input id="oa" value="${esc((c.offer&&c.offer.approver)||j.approver)}"></label></div>
  <div class="sub">Budget for this job: ${j.budgetMax?"₹"+esc(j.budgetMax)+" LPA. Above it, HR head or finance must also approve.":"not set."}</div>
  <div class="actions"><button class="dark" onclick="sendApproval('${c.id}')">Send for approval</button><span class="spacer"></span><button class="danger" onclick="rejectForm('${c.id}')">Reject</button></div></div>`;
  const o=c.offer||{},b=(c.bgv||{}).status||"Not started";
  return `<div class="panel"><div class="ph"><h2>Approved offer</h2><span class="sub">Approved by ${esc(o.approver)} ${o.decidedAt?"on "+fmtD(o.decidedAt):""}</span></div><div class="facts"><div><div class="k">CTC</div><div class="v">${inr(o.ctc)}</div></div><div><div class="k">DOJ</div><div class="v">${fmtD(o.doj)}</div></div><div><div class="k">Designation</div><div class="v">${esc(o.designation)}</div></div><div><div class="k">Location</div><div class="v">${esc(o.location)}</div></div></div></div>
  <div class="cols even"><div class="panel"><div class="ph"><h2>Background verification</h2></div><select id="bgvp" onchange="bgvSet('${c.id}',this.value)" aria-label="BGV status">${["Not started","Consent sent","In progress","Clear","Discrepancy"].map(s=>`<option ${b===s?"selected":""}>${s}</option>`).join("")}</select>
  ${b==="Discrepancy"?`<div class="notice bad">Give the candidate a chance to clarify before any decision. Withdrawing the offer needs HR head approval.</div>`:""}<div class="sub">Documents: government ID, education certificates, previous employment and relieving letters, recent payslips.</div></div>
  <div class="panel"><div class="ph"><h2>Offer status</h2></div><div class="actions">${c.offerReleasedAt?`<span class="pill good">Released ${fmtD(c.offerReleasedAt)}</span>`:`<button class="dark" onclick="release('${c.id}')">Mark offer released</button>`}
  ${c.offerReleasedAt&&!c.acceptedAt?`<button onclick="accepted('${c.id}')">Candidate accepted</button>`:""}${c.acceptedAt?`<span class="pill good">Accepted ${fmtD(c.acceptedAt)}</span>`:""}
  ${c.acceptedAt&&c.stage!=="Joined"?`<button class="dark" onclick="joined('${c.id}')" ${b==="Clear"?"":"disabled"}>Mark joined</button>${b==="Clear"?"":`<span class="sub">Needs BGV clear</span>`}`:""}${c.stage==="Joined"?`<span class="pill good">Joined</span>`:""}</div></div></div>
  <div class="panel"><div class="ph"><h2>Offer letter</h2><span class="sub">Subject to background verification</span></div><pre class="msg">${esc(offerLetter(c,j))}</pre><div class="actions"><button onclick="copyText(offerLetter(S.cands['${c.id}'],jobOf(S.cands['${c.id}'])))">Copy letter</button></div></div>`;

function pActivity(c){return `<div class="panel"><div class="ph"><h2>Activity</h2><span class="sub">Audit trail of every action</span></div><div class="hist">${(c.history||[]).map(h=>`<div><b>${fmt(h.t)}</b> · ${esc(h.text)} <span class="sub">${esc(h.by)}</span></div>`).join("")}</div></div>`}
function pPortal(c,j){
  const steps=["Application received","Resume screening","Interviews","Final decision","Offer","Background check","Joining"];
  const map={"New":0,"Prescreen":1,"Interview":2,"Decision":3,"Offer approval":3,"BGV & offer":4,"Offer released":5,"Joined":6};
  const pos=c.stage===OUT?(map[STAGES[c.rejectedAtIdx??1]]??1):map[c.stage];
  const r=curRound(c),d=due(c);let nowT="",next="";
  if(c.stage===OUT){nowT="We won't be moving forward with your application.";next="We've emailed you the reason and some pointers. Thank you for your time."}
  else if(c.stage==="New"||c.stage==="Prescreen"){nowT=(c.screen&&c.screen.candidateNote)||"Your profile is being reviewed.";next=`${c.assignedTo} will contact you for a short screening call.`}
  else if(c.stage==="Interview"&&r){const w=rTime(r);nowT=w?`Your ${r.name} is on ${fmt(w)}.`:`You cleared screening. We're scheduling your ${r.name}.`;next=w?(r.mode==="In-person"?`In person at ${r.address||"our office"}. Ask for ${r.contact||c.assignedTo}.`:`${r.platform||"Video"} call. The link is in your invite.`):"You'll get an invite with the date, time and joining details."}
  else if(c.stage==="Decision"||c.stage==="Offer approval"){nowT="Your interviews are complete. The hiring team is deciding.";next="We'll update you on the outcome."}
  else if(c.stage==="BGV & offer"){nowT="You've been selected! Your offer letter is being prepared.";next="Background check: please complete the consent form and share your documents."}
  else if(c.stage==="Offer released"){nowT=c.acceptedAt?"Thanks for accepting. We're getting ready for your first day.":"Your offer has been sent. Please review and sign it.";next=`Background check: ${(c.bgv||{}).status||"starting soon"}.`}
  else if(c.stage==="Joined"){nowT="Welcome aboard!"}
  return `<div class="sub">What ${esc(c.name.split(" ")[0])} sees on their secure status link (expiring link in the MVP, OTP in v1.1). Internal scores, panel comments and AI flags are never shown.</div>
  <div class="portal"><div class="sub">Hello, ${esc(c.name.split(" ")[0])}</div><h2>Application status</h2>
  <div class="cardlet"><b>Applied for</b><span class="sub">${esc(j.title)}</span></div>
  <div class="cardlet"><b>${esc(nowT)}</b>${next?`<span class="sub">${esc(next)}</span>`:""}</div>
  ${d&&active(c)?`<div class="cardlet"><b>Next update expected</b><span class="sub">${fmtD(d)}</span></div>`:""}
  <h3>Your journey</h3><div class="journey">${steps.map((s,i)=>`<div class="${c.stage===OUT?(i<pos?"d":i===pos?"x":""):(i<pos||c.stage==="Joined"?"d":i===pos?"c":"")}"><i></i>${s}${c.stage===OUT&&i===pos?" · closed":""}</div>`).join("")}</div>
  <div class="cardlet"><b>Need help?</b><span class="sub">Your recruiter is ${esc(c.assignedTo)}. Privacy: your data is used only for this application.</span></div></div>`;
}

function modal(html){closeModal();$("#layer").insertAdjacentHTML("beforeend",`<div class="modal" id="mdl" onclick="if(event.target===this)closeModal()"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`);const f=$("#mdl input,#mdl select,#mdl textarea");f&&f.focus()}
window.closeModal=()=>{const m=$("#mdl");m&&m.remove()};

window.srcOpts=()=>{const j=S.jobs[$("#cj").value];$("#cs").innerHTML=[...new Set([...(j.platforms||[]),...SOURCES])].map(o=>`<option>${esc(o)}</option>`).join("")};
window.readResume=async(inp,ta,fill)=>{
  const f=inp.files[0];if(!f)return;const t=$("#"+ta);t.value="Reading file…";
  try{const buf=await f.arrayBuffer();let text="";
    if(/\.pdf$/i.test(f.name)&&window.pdfjsLib){const pdf=await pdfjsLib.getDocument({data:buf}).promise;for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);text+=(await p.getTextContent()).items.map(x=>x.str).join(" ")+"\n"}}
    else if(/\.docx$/i.test(f.name)&&window.mammoth)text=(await mammoth.extractRawText({arrayBuffer:buf})).value;
    else text=new TextDecoder().decode(buf);
    t.value=text.trim();if(!text.trim())toast("No text found in that file. Paste the resume text instead.");
    if(fill){const n=$("#cn");const first=(text.trim().split("\n")[0]||"").trim();if(n&&!n.value&&first.length<40)n.value=first;
      const em=text.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(em&&!$("#ce").value)$("#ce").value=em[0];
      const ph=text.match(/(\+?\d[\d\s-]{8,}\d)/);if(ph&&!$("#cp").value)$("#cp").value=ph[0].trim()}
  }catch(e){t.value="";toast("Couldn't read that file. Paste the resume text instead.")}
};
async function createCand(o){
  const j=o.job,load=r=>Object.values(S.cands).filter(c=>c.assignedTo===r&&active(c)).length;
  let to=j.poc,why="POC on the requisition";if(j.backup&&load(j.poc)>=S.settings.overflow&&load(j.backup)<load(j.poc)){to=j.backup;why=`backup; ${j.poc} has ${load(j.poc)} active`}
  const c={id:uid(),name:o.name,jobId:j.id,email:o.email,phone:o.phone,source:o.source,exp:o.exp,resume:o.resume,assignedTo:to,stage:"New",stageAt:now(),maxIdx:0,createdAt:now(),updatedAt:now(),checklist:{},rounds:(j.rounds||[]).map(n=>({name:n,status:"pending"})),history:[]};
  log(c,`Applied via ${c.source}; assigned to ${to} (${why})`);
  await put("cand",c);await pushAlert("New candidate",`${c.name} applied for ${j.title} via ${c.source}. Assigned to ${to}.`,c.id,"info");
  return c;
}
window.saveCand=async()=>{
  const v=k=>$(k).value.trim();if(!v("#cn")){toast("Add the candidate's name");return}
  const runAi=$("#cai").checked&&v("#cr");
  const c=await createCand({name:v("#cn"),job:S.jobs[v("#cj")],email:v("#ce"),phone:v("#cp"),source:v("#cs"),exp:v("#cx"),resume:v("#cr")});
  closeModal();ui.ptabFor=null;go("cand-"+c.id);if(runAi)runScreen(c.id);
};
window.reassign=async(id,r)=>{const c=S.cands[id];if(r===c.assignedTo)return;const old=c.assignedTo;c.assignedTo=r;log(c,`Reassigned from ${old} to ${r}`);await put("cand",c);await pushAlert("Reassigned",`${c.name} reassigned to ${r}`,c.id,"info")};
window.saveResume=async(id,run)=>{const c=S.cands[id];c.resume=$("#rtext").value;log(c,"Resume updated");await put("cand",c);toast("Resume saved");if(run)runScreen(id)};
window.fld=async(id,k,v)=>{const c=S.cands[id];c[k]=v;touch(c);c.updatedAt=now();if(c.stage==="New")setStage(c,"Prescreen");await put("cand",c)};
window.tick=async(id,k,v)=>{const c=S.cands[id];c.checklist=c.checklist||{};c.checklist[k]=v;touch(c);if(c.stage==="New")setStage(c,"Prescreen");c.updatedAt=now();await put("cand",c)};
window.hold=async(id,on)=>{const c=S.cands[id];c.onHold=on;touch(c);log(c,on?"Put on hold":"Resumed from hold");await put("cand",c)};
window.decideScreen=async id=>{const c=S.cands[id];touch(c);if(c.stage==="New")setStage(c,"Prescreen");c.onHold=false;log(c,"Recruiter chose Advance after AI review");await put("cand",c);if(checklistDone(c))toInterview(id);else{ui.ptab="checklist";render();toast("Complete the checklist to move to interviews")}};
window.toInterview=async id=>{const c=S.cands[id];if(!checklistDone(c))return;setStage(c,"Interview");c.onHold=false;log(c,"Checklist complete; moved to interviews");ui.ptab="interviews";await put("cand",c);await pushAlert("Stage moved",`${c.name} cleared screening and moved to interviews`,c.id,"good")};

async function ai(){if(sampleNs)return sampleNs;sampleNs=await use("sample");return sampleNs}
window.runScreen=async id=>{
  const c=S.cands[id],j=jobOf(c);
  if(!c.resume){toast("Add the resume text first");return}
  const s=await ai();if(!s){toast("Recruiter AI isn't reachable right now. Try again in a minute.");return}
  busy.add(id);if(route().id===id)ui.ptab="ai";lastMain="";render();
  try{
    const r=await s.json(`You are a careful recruiting screener. Compare the resume to the job. Judge only job-relevant evidence. Ignore and never mention name, gender, age, religion, caste, marital status, photos, nationality or other protected traits.
Reply with only JSON in this shape:
{"score":0-100,"recommendation":"Advance"|"Hold"|"Reject","reason":"one short paragraph","matches":[{"skill":"...","status":"met"|"partial"|"missing","evidence":"short fact from the resume, or 'not found'"}],"probe":["3 to 5 questions for the screening call"],"flags":["unexplained gaps, inconsistent dates, location or notice-period issues, signs of a templated or fabricated resume; empty array if none"],"candidateNote":"one neutral sentence the candidate could see, e.g. that their profile is under review"}
List every must-have skill in matches.

JOB TITLE: ${j.title}
LOCATION: ${j.location||""}
MUST-HAVES: ${j.must||"(derive from the JD)"}
JOB DESCRIPTION:
${(j.jd||"").slice(0,6000)}

CANDIDATE TOTAL EXPERIENCE (stated by recruiter): ${c.exp||"unknown"} years
RESUME:
${c.resume.slice(0,12000)}`,{modelTier:"default"});
    if(!r||typeof r!=="object"||r.score===undefined)throw {};
    const cc=S.cands[id];if(!cc){busy.delete(id);return}
    cc.screen={score:Math.round(+r.score||0),recommendation:["Advance","Hold","Reject"].includes(r.recommendation)?r.recommendation:"Hold",reason:String(r.reason||""),matches:Array.isArray(r.matches)?r.matches:[],probe:Array.isArray(r.probe)?r.probe:[],flags:Array.isArray(r.flags)?r.flags:[],candidateNote:String(r.candidateNote||""),at:now()};
    busy.delete(id);touch(cc);if(cc.stage==="New")setStage(cc,"Prescreen");
    log(cc,`AI screen: ${cc.screen.score}%, recommends ${cc.screen.recommendation}`,"Recruiter AI");
    await put("cand",cc);
    await pushAlert("AI screen ready",`${cc.name} for ${j.title}: ${cc.screen.score}% match, AI recommends ${cc.screen.recommendation}. Your decision is needed.`,id,cc.screen.recommendation==="Reject"?"warn":"info");
  }catch(e){busy.delete(id);lastMain="";render();toast(e&&e.code==="not_granted"?"AI access was declined for this page":e&&e.code==="rate_limited"?"Recruiter AI has reached its demo limit for now. Try again later.":"AI screening failed. Try again.")}
};

window.submitFb=async id=>{const c=S.cands[id],r=curRound(c);
  const fb={scores:Object.fromEntries(COMPS.map(([k])=>[k,+$("#fs-"+k).value])),rec:$("#frec").value,recording:$("#frecd").value.trim(),comments:$("#fcom").value.trim(),at:now(),by:r.panel||me()||"Panel"};

  await put("cand",c);await pushAlert("Feedback in",`${c.name}: ${r.name} scorecard submitted (${fb.rec}). ${next?"Schedule "+next.name+".":"All rounds done, ready for a decision."}`,c.id,/yes/i.test(fb.rec)?"good":"warn")};

window.packAi=async id=>{const c=S.cands[id];const s=await ai();if(!s){toast("AI isn't available here");return}
  const b=$("#pack-"+id);if(b){b.disabled=true;b.textContent="Summarising…"}
  try{const r=await s(`Summarise this candidate's interview feedback for a hiring manager in under 120 words. Use exactly three lines starting "**Strengths:**", "**Concerns:**", "**Check before offer:**". Mention any disagreement between panelists. Do not mention protected traits.\n\nRole: ${jobOf(c).title}\n${(c.rounds||[]).filter(r=>r.feedback).map(r=>`${r.name} (${r.panel}): ${r.feedback.rec}, ${overall(r.feedback)}/5. ${r.feedback.comments}`).join("\n")}`,{modelTier:"default"});
    c.pack=r.text.trim();await put("cand",c)}catch(e){toast("AI summary failed. Try again.");lastMain="";render()}};
window.sendApproval=async id=>{const c=S.cands[id],j=jobOf(c);
  const o={ctc:$("#oc").value,doj:$("#od").value,designation:$("#og").value.trim(),location:$("#ol").value.trim(),bonus:$("#ob").value.trim(),approver:$("#oa").value.trim(),approval:"pending",sentAt:now()};
  if(!o.ctc||!o.doj||!o.approver){toast("Add proposed CTC, date of joining and approver");return}
  o.overBudget=!!(j.budgetMax&&+o.ctc>+j.budgetMax);c.offer=o;setStage(c,"Offer approval");
  log(c,`Offer sent for approval to ${o.approver}: ₹${o.ctc} LPA, DOJ ${fmtD(o.doj)}${o.overBudget?" (above budget)":""}`);await put("cand",c);
  await pushAlert("Approval needed",`${o.approver}: approve the offer for ${c.name}, ${o.designation}, ₹${o.ctc} LPA, DOJ ${fmtD(o.doj)}${o.overBudget?`. Above the ₹${j.budgetMax} LPA budget, so HR head or finance must also approve.`:"."}`,c.id,o.overBudget?"bad":"warn")};
window.decide=async(id,d)=>{const c=S.cands[id],o=c.offer,com=($("#acom-"+id)||{value:""}).value.trim();
  if(d!=="approved"&&!com){toast("Add a comment to send back or decline");$("#acom-"+id).focus();return}
  o.approval=d;o.decidedAt=now();o.comment=com;
  if(d==="approved"){setStage(c,"BGV & offer");c.bgv={status:"Not started"};log(c,`Offer approved by ${o.approver}${o.overBudget?" and HR head / finance":""}${com?": "+com:""}`);await put("cand",c);
    await pushAlert("Start BGV",`Offer approved for ${c.name}. Start background verification: send the consent form and document checklist to the candidate and BGV vendor.`,c.id,"warn");
    await pushAlert("Release offer",`Offer approved for ${c.name}: ₹${o.ctc} LPA, DOJ ${fmtD(o.doj)}. Release the offer letter subject to BGV.`,c.id,"good");toast("Approved. BGV and offer-release alerts sent.")}
  else{setStage(c,"Decision");log(c,`Offer ${d==="back"?"sent back":"declined"} by ${o.approver}: ${com}`);await put("cand",c);await pushAlert(d==="back"?"Offer sent back":"Offer declined",`${o.approver} ${d==="back"?"sent back":"declined"} the offer for ${c.name}: ${com}`,c.id,"bad")}};

REQUISITION: ${rqTitle(r)}; ${f.positions} position(s); ${f.expMin}-${f.expMax} years; must-haves: ${mustList(f).join(", ")}; nice-to-have: ${f.nice||"-"}; location: ${f.locations} (${f.workMode}); budget ₹${f.ctcMin}-${f.ctcMax} LPA per position; target joining ${f.targetDate}.
EMPLOYEES:
${rules.map(e=>{const b=S.bench.find(x=>x.empId===e.empId);return `${b.empId} | ${b.title} | skills: ${(b.skills||[]).join(", ")} | ${b.exp} yrs | ${b.location} | available ${b.availableFrom||"now"} | current cost ₹${b.costLPA} LPA`}).join("\n")}`,{modelTier:"default"});

  let r=id?JSON.parse(JSON.stringify(S.reqs[id])):null;
  if(!r){S.cat.seq=(+S.cat.seq||1000)+1;r={id:"rq"+uid(),no:"REQ-"+S.cat.seq,version:1,status:"Draft",requester:me()||"Demo user",createdAt:now(),audit:[],versions:[]};await saveCat();audit(r,"Draft created","")}
  const resubmit=submit&&["Returned for changes","Rejected"].includes(r.status);
  if(resubmit){r.versions=r.versions||[];r.versions.unshift({version:r.version,at:now(),status:r.status,form:r.form,note:r.status==="Rejected"?r.rejection.reason:(r.returned&&r.returned.comment)||""});r.version++;r.route=[];r.rmg=null;r.aiSummary="";}

  audit(r,"Routed to RMG queue",`${divOf(f.division).name} · SLA ${S.cat.sla.rmg}h`,"Recruiter Desk");
  notify(holders("RMG",f.division),"RMG review",`Check internal resources for ${r.no}: ${rqTitle(r)}`,emailBody(r,`A new requisition needs an internal-resource check before it goes to the approver. SLA: ${S.cat.sla.rmg} hours.`),r,"warn");
  notify([r.requester],"Requisition submitted",`${r.no} submitted and with RMG`,emailBody(r,"Your requisition is with RMG, who check internal and bench resources first."),r,"info");

  return `<div class="panel"><div class="ph"><h2>People &amp; roles</h2><span class="sub">Role-based access. A person who signs in with this email sees only their role's data.</span></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Division</th><th></th></tr></thead><tbody>${people().map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.email)}</td><td><div class="chips">${(p.roles||[]).map(x=>`<span class="pill plain">${esc(x)}</span>`).join("")}</div></td><td>${esc(p.division?divOf(p.division).name:"All")}</td><td><button class="small" onclick="personForm(${i})">Edit</button></td></tr>`).join("")}</tbody></table></div><div><button class="small dark" onclick="personForm(-1)">+ Add person</button></div></div>
  <div class="cols even"><div class="panel"><div class="ph"><h2>Divisions</h2><span class="sub">Type drives approval routing</span></div>${(c.divisions||[]).map((d,i)=>`<div class="attrow" style="cursor:default"><span class="grow"><b>${esc(d.name)}</b><small>${esc({delivery:"Delivery / project → Project Head",site:"Site / location → Site Head",corporate:"Corporate function → Management"}[d.type])}</small></span><button class="small" onclick="delDiv(${i})">Remove</button></div>`).join("")}
   <div class="grid2"><label class="f" for="dv-n">Name<input id="dv-n"></label><label class="f" for="dv-t">Type<select id="dv-t"><option value="delivery">Delivery / project</option><option value="site">Site / location</option><option value="corporate">Corporate function</option></select></label></div><div><button class="small dark" onclick="addDiv()">+ Add division</button></div></div>
  <div class="panel"><div class="ph"><h2>Routing &amp; SLAs</h2></div><div class="grid2">
   <label class="f" for="rt-t">Add Management above total budget (₹ LPA)<input id="rt-t" type="number" value="${esc(rt.mgmtTotal)}" onchange="setCat('routing','mgmtTotal',+this.value)"></label>
   <label class="f" for="rt-p">Add Management above positions<input id="rt-p" type="number" value="${esc(rt.mgmtPositions)}" onchange="setCat('routing','mgmtPositions',+this.value)"></label>
   <label class="f" for="sl-r">RMG SLA (hours)<input id="sl-r" type="number" value="${esc(sl.rmg)}" onchange="setCat('sla','rmg',+this.value)"></label><label class="f" for="sl-rr">RMG reminder (hours)<input id="sl-rr" type="number" value="${esc(sl.rmgRemind)}" onchange="setCat('sla','rmgRemind',+this.value)"></label>
   <label class="f" for="sl-a">Approver SLA (hours)<input id="sl-a" type="number" value="${esc(sl.appr)}" onchange="setCat('sla','appr',+this.value)"></label><label class="f" for="sl-ar">Approver reminder (hours)<input id="sl-ar" type="number" value="${esc(sl.apprRemind)}" onchange="setCat('sla','apprRemind',+this.value)"></label>
   <label class="f" for="sl-t">TA assignment SLA (business hours)<input id="sl-t" type="number" value="${esc(sl.ta)}" onchange="setCat('sla','ta',+this.value)"></label><label class="f" for="ai-th">AI internal-match threshold (%)<input id="ai-th" type="number" value="${esc(c.aiThreshold)}" onchange="S.cat.aiThreshold=+this.value;saveCat()"></label></div>
   <label class="check"><input type="checkbox" id="rt-b" ${rt.mgmtAboveBand?"checked":""} onchange="setCat('routing','mgmtAboveBand',this.checked)"> Add Management when budget is above the standard band</label><div class="sub">Business hours: Mon–Fri, 9:30 AM–6:30 PM IST.</div></div></div>
  <div class="panel"><div class="ph"><h2>Role catalogue</h2><span class="sub">Standard CTC bands per level (₹ LPA per position)</span></div><div class="tablewrap"><table><thead><tr><th>Title</th><th>Job family</th><th>Level</th><th>Band</th><th></th></tr></thead><tbody>${(c.roles||[]).map((x,i)=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.family)}</td><td>${esc(x.level)}</td><td class="num">₹${esc(x.bandMin)}–${esc(x.bandMax)}</td><td><button class="small" onclick="delRole(${i})">Remove</button></td></tr>`).join("")}</tbody></table></div>
   <div class="grid2"><label class="f" for="rc-t">Title<input id="rc-t"></label><label class="f" for="rc-f">Job family<select id="rc-f">${Object.keys(c.familyRounds).map(f=>`<option>${esc(f)}</option>`).join("")}</select></label><label class="f" for="rc-l">Level<input id="rc-l" placeholder="L3 / Senior"></label><label class="f" for="rc-mn">Band min<input id="rc-mn" type="number" step="0.5"></label><label class="f" for="rc-mx">Band max<input id="rc-mx" type="number" step="0.5"></label></div><div><button class="small dark" onclick="addRole()">+ Add role</button></div></div>
  <div class="panel"><div class="ph"><h2>Bench &amp; available employees</h2><span class="sub">${(S.bench||[]).length} employees · used by RMG and the AI internal match</span></div>
   <div class="tablewrap"><table><thead><tr><th>Employee</th><th>Skills</th><th>Exp</th><th>Location</th><th>Available</th><th>Cost</th><th></th></tr></thead><tbody>${(S.bench||[]).map((e,i)=>`<tr><td><b>${esc(e.name)}</b><div class="sub">${esc(e.empId)} · ${esc(e.title)}</div></td><td>${esc((e.skills||[]).join(", "))}</td><td class="num">${esc(e.exp)}</td><td>${esc(e.location)}</td><td>${e.availableFrom?fmtD(e.availableFrom):"Now"}</td><td class="num">₹${esc(e.costLPA)}</td><td><button class="small" onclick="S.bench.splice(${i},1);saveBench()">Remove</button></td></tr>`).join("")}</tbody></table></div>
   <label class="f" for="bn-csv">Import CSV (empId, name, title, skills separated by ;, exp, location, availableFrom YYYY-MM-DD, costLPA)<textarea id="bn-csv" rows="3" placeholder="E1042,Ravi Teja,Java Developer,Java;Spring Boot;AWS,6,Hyderabad,2026-11-20,18"></textarea></label><div><button class="small dark" onclick="importBench()">Import</button></div></div>`}
window.setCat=(g,k,v)=>{S.cat[g][k]=v;saveCat()};
window.addDiv=()=>{const n=$("#dv-n").value.trim();if(!n){toast("Add a name");return}S.cat.divisions.push({id:"div-"+uid(),name:n,type:$("#dv-t").value});saveCat()};
window.delDiv=i=>{S.cat.divisions.splice(i,1);saveCat()};
window.addRole=()=>{const t=$("#rc-t").value.trim(),l=$("#rc-l").value.trim(),mn=$("#rc-mn").value,mx=$("#rc-mx").value;if(!t||!l||!mn||!mx||+mx<+mn){toast("Fill title, level and a valid band");return}S.cat.roles.push({id:"role-"+uid(),title:t,family:$("#rc-f").value,level:l,bandMin:mn,bandMax:mx});saveCat()};
window.delRole=i=>{S.cat.roles.splice(i,1);saveCat()};
window.personForm=i=>{const p=i>=0?people()[i]:{name:"",email:"",roles:[],division:""};modal(`<h2>${i>=0?"Edit person":"Add person"}</h2><div class="grid2"><label class="f" for="pp-n">Name<input id="pp-n" value="${esc(p.name)}"></label><label class="f" for="pp-e">Email (used to sign in)<input id="pp-e" type="email" value="${esc(p.email)}"></label>
  <label class="f" for="pp-d">Division<select id="pp-d"><option value="">All divisions</option>${(S.cat.divisions||[]).map(d=>`<option value="${d.id}" ${p.division===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</select></label></div>
  <fieldset style="border:1px solid var(--line);border-radius:10px;padding:10px"><legend class="sub">Roles</legend><div class="grid2">${ROLE_LIST.map(r=>`<label class="check" style="padding:2px 0"><input type="checkbox" class="pp-r" value="${r}" ${(p.roles||[]).includes(r)?"checked":""}> ${r}</label>`).join("")}</div></fieldset>
  <div class="actions"><button class="dark" onclick="savePerson(${i})">Save</button>${i>=0?`<button class="danger" onclick="S.cat.people.splice(${i},1);closeModal();saveCat()">Remove</button>`:""}<button onclick="closeModal()">Cancel</button></div>`)};
window.savePerson=i=>{const n=$("#pp-n").value.trim(),e=$("#pp-e").value.trim(),rs=[...document.querySelectorAll(".pp-r:checked")].map(x=>x.value);if(!n||!rs.length){toast("Add a name and at least one role");return}const p={name:n,email:e,roles:rs,division:$("#pp-d").value};if(i>=0)S.cat.people[i]=p;else S.cat.people.push(p);closeModal();saveCat()};
window.importBench=()=>{const ls_=$("#bn-csv").value.trim().split(/\r?\n/).filter(Boolean);let n=0;ls_.forEach(l=>{const v=l.split(",").map(x=>x.trim());if(v.length<8||/^empid$/i.test(v[0]))return;const e={empId:v[0],name:v[1],title:v[2],skills:v[3].split(";").map(x=>x.trim()).filter(Boolean),exp:v[4],location:v[5],availableFrom:v[6],costLPA:v[7]};const k=S.bench.findIndex(x=>x.empId===e.empId);if(k>=0)S.bench[k]=e;else S.bench.push(e);n++});$("#bn-csv").value="";saveBench();toast(`Imported ${n} employee${n===1?"":"s"}`)};
